[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuan-harness"
version = "0.7.0"
description = "面向 LLM 软件工程的协议优先确定性 Harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
yuan = "yuan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yuan = ["protocol.md", "bootstrap.md", "profiles/**/*.md", "profiles/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
