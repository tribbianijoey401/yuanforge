{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://yuanforge.local/core/0.1/evidence.schema.json",
  "title": "Yuan Core 0.1 Evidence",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema_version", "evidence_id", "work_binding", "ac_id", "kind",
    "created_at", "source_attempt_id", "status", "assertions", "checks",
    "artifact_binding", "environment_binding", "verifier_binding",
    "harness_binding", "logs", "freshness", "independence", "immutable_digest"
  ],
  "properties": {
    "schema_version": {"const": "yuan.evidence/v1"},
    "evidence_id": {"type": "string", "pattern": "^EVD-[A-Za-z0-9._-]+$"},
    "work_binding": {"$ref": "#/$defs/binding"},
    "ac_id": {"type": "string", "pattern": "^AC-[A-Za-z0-9._-]+$"},
    "kind": {"enum": ["logic", "integration", "contract", "structure", "review", "human-judgment", "tool-receipt"]},
    "created_at": {"type": "string", "format": "date-time"},
    "source_attempt_id": {"type": "string", "pattern": "^ATT-[A-Za-z0-9._-]+$"},
    "status": {"enum": ["PASS", "FAIL", "ERROR"]},
    "assertions": {"type": "integer", "minimum": 0},
    "checks": {
      "type": "array",
      "items": {
        "type": "object", "additionalProperties": false,
        "required": ["id", "status", "observation"],
        "properties": {
          "id": {"type": "string", "minLength": 1},
          "status": {"enum": ["PASS", "FAIL", "ERROR"]},
          "observation": {"type": "string"}
        }
      }
    },
    "artifact_binding": {
      "type": "object", "additionalProperties": false,
      "required": ["scope", "sha256"],
      "properties": {
        "scope": {"type": "string", "minLength": 1},
        "sha256": {"$ref": "#/$defs/sha256"}
      }
    },
    "environment_binding": {
      "type": "object", "additionalProperties": false,
      "required": ["id", "fingerprint"],
      "properties": {
        "id": {"type": "string", "minLength": 1},
        "fingerprint": {"$ref": "#/$defs/sha256"}
      }
    },
    "verifier_binding": {
      "allOf": [
        {"$ref": "#/$defs/binding"},
        {
          "type": "object",
          "required": ["trust_root_id"],
          "properties": {"trust_root_id": {"type": "string", "minLength": 1}}
        }
      ]
    },
    "harness_binding": {"$ref": "#/$defs/binding"},
    "logs": {
      "type": "object", "additionalProperties": false,
      "required": ["stdout_sha256", "stderr_sha256", "receipt_sha256"],
      "properties": {
        "stdout_sha256": {"$ref": "#/$defs/sha256"},
        "stderr_sha256": {"$ref": "#/$defs/sha256"},
        "receipt_sha256": {"$ref": "#/$defs/sha256"}
      }
    },
    "freshness": {
      "type": "object", "additionalProperties": false,
      "required": ["observed_artifact_sha256", "not_after"],
      "properties": {
        "observed_artifact_sha256": {"$ref": "#/$defs/sha256"},
        "not_after": {"type": ["string", "null"], "format": "date-time"}
      }
    },
    "independence": {
      "type": "object", "additionalProperties": false,
      "required": ["method", "author_identity", "verifier_identity", "independent"],
      "properties": {
        "method": {"enum": ["old-trust-root", "held-out", "external", "human-authorized"]},
        "author_identity": {"type": "string", "minLength": 1},
        "verifier_identity": {"type": "string", "minLength": 1},
        "independent": {"type": "boolean"}
      }
    },
    "immutable_digest": {"$ref": "#/$defs/sha256"}
  },
  "$defs": {
    "sha256": {"type": "string", "pattern": "^[0-9a-f]{64}$"},
    "binding": {
      "type": "object",
      "required": ["id", "revision", "sha256"],
      "properties": {
        "id": {"type": "string", "minLength": 1},
        "revision": {"type": "string", "minLength": 1},
        "sha256": {"$ref": "#/$defs/sha256"}
      }
    }
  }
}
