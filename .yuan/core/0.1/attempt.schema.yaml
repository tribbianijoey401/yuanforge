{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://yuanforge.local/core/0.1/attempt.schema.json",
  "title": "Yuan Core 0.1 Attempt",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema_version", "attempt_id", "work_binding", "protocol_binding",
    "harness_binding", "sequence", "strategy_fingerprint", "relevant_inputs",
    "hypothesis", "action", "budget_charge", "journal", "side_effect_state",
    "tool_receipt", "evidence_ids", "outcome"
  ],
  "properties": {
    "schema_version": {"const": "yuan.attempt/v1"},
    "attempt_id": {"type": "string", "pattern": "^ATT-[A-Za-z0-9._-]+$"},
    "work_binding": {"$ref": "#/$defs/binding"},
    "protocol_binding": {"$ref": "#/$defs/binding"},
    "harness_binding": {"$ref": "#/$defs/binding"},
    "sequence": {"type": "integer", "minimum": 1},
    "strategy_fingerprint": {"$ref": "#/$defs/sha256"},
    "relevant_inputs": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/artifact"}},
    "hypothesis": {
      "type": "object", "additionalProperties": false,
      "required": ["claim", "falsification"],
      "properties": {
        "claim": {"type": "string", "minLength": 1},
        "falsification": {"type": "string", "minLength": 1}
      }
    },
    "action": {
      "type": "object", "additionalProperties": false,
      "required": ["type", "mutating", "side_effect_class", "scope", "authorization_grant_id", "high_impact"],
      "properties": {
        "type": {"enum": ["file-read", "file-write", "command", "llm-propose", "verify", "reconcile"]},
        "mutating": {"type": "boolean"},
        "side_effect_class": {"type": "string", "minLength": 1},
        "scope": {"type": "string", "minLength": 1},
        "authorization_grant_id": {"type": ["string", "null"]},
        "high_impact": {"type": "boolean"}
      }
    },
    "budget_charge": {
      "type": "object", "additionalProperties": false,
      "required": ["ticks", "tool_calls", "strategies", "command_seconds"],
      "properties": {
        "ticks": {"type": "integer", "minimum": 0},
        "tool_calls": {"type": "integer", "minimum": 0},
        "strategies": {"type": "integer", "minimum": 0},
        "command_seconds": {"type": "number", "minimum": 0}
      }
    },
    "journal": {
      "type": "array",
      "items": {
        "type": "object", "additionalProperties": false,
        "required": ["ordinal", "state", "recorded_at", "receipt_sha256"],
        "properties": {
          "ordinal": {"type": "integer", "minimum": 1},
          "state": {"enum": ["PREPARED", "EXECUTING", "OBSERVED", "COMMITTED", "UNKNOWN"]},
          "recorded_at": {"type": "string", "format": "date-time"},
          "receipt_sha256": {"type": ["string", "null"], "pattern": "^[0-9a-f]{64}$"}
        }
      }
    },
    "side_effect_state": {"enum": ["NOT_APPLICABLE", "PREPARED", "EXECUTING", "OBSERVED", "COMMITTED", "UNKNOWN"]},
    "tool_receipt": {
      "type": ["object", "null"],
      "required": ["schema_version", "kind", "operation_id", "status"],
      "properties": {
        "schema_version": {"const": "yuan.tool-receipt/v1"},
        "kind": {"enum": ["file-read", "file-write", "command", "llm-propose"]},
        "operation_id": {"type": "string", "minLength": 1},
        "status": {"type": "string", "minLength": 1},
        "before_sha256": {"type": ["string", "null"], "pattern": "^[0-9a-f]{64}$"},
        "after_sha256": {"type": ["string", "null"], "pattern": "^[0-9a-f]{64}$"},
        "stdout_sha256": {"type": ["string", "null"], "pattern": "^[0-9a-f]{64}$"},
        "stderr_sha256": {"type": ["string", "null"], "pattern": "^[0-9a-f]{64}$"},
        "exit_code": {"type": ["integer", "null"]}
      }
    },
    "evidence_ids": {"type": "array", "uniqueItems": true, "items": {"type": "string"}},
    "outcome": {"enum": ["PENDING", "SUCCEEDED", "FAILED", "UNKNOWN"]}
  },
  "$defs": {
    "sha256": {"type": "string", "pattern": "^[0-9a-f]{64}$"},
    "binding": {
      "type": "object", "additionalProperties": false,
      "required": ["id", "revision", "sha256"],
      "properties": {
        "id": {"type": "string", "minLength": 1},
        "revision": {"type": "string", "minLength": 1},
        "sha256": {"$ref": "#/$defs/sha256"}
      }
    },
    "artifact": {
      "type": "object", "additionalProperties": false,
      "required": ["scope", "sha256"],
      "properties": {
        "scope": {"type": "string", "minLength": 1},
        "sha256": {"$ref": "#/$defs/sha256"}
      }
    }
  }
}
