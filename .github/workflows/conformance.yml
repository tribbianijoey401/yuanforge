name: Yuan 一致性验证

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 运行完整 Conformance
        run: python -B scripts/run_conformance.py
      - name: 验证 Wheel 构建
        run: python -m pip wheel . --no-deps --wheel-dir dist/wheel
